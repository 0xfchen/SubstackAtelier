[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "substack2markdown"
version = "0.1.0"
description = "Scrape and archive Substack newsletters into Markdown and HTML formats."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Tim Farrelly" },
]
dependencies = [
    "beautifulsoup4>=4.12.0",
    "html-to-markdown>=3.17.0",
    "mdformat>=0.7.17",
    "mdformat-frontmatter>=2.0.0",
    "mdformat-gfm>=0.3.5",
    "playwright>=1.40.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "tqdm>=4.66.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[dependency-groups]
dev = [
    "pymarkdownlnt>=0.9.15",
    "pytest>=8.0.0",
    "ruff>=0.16.7",
]

[project.scripts]
scraper = "scraper:main"

[tool.setuptools]
packages = ["scraper", "scraper.fetchers"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

